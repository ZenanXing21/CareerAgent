[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-agent"
version = "0.1.0"
description = "Traceable domain models for the Career Agent POC"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "brotlicffi>=1.2.0.2,<2",
    "fastapi>=0.115,<1",
    "langgraph>=1.0,<2",
    "httpx>=0.28,<1",
    "mcp>=2,<3",
    "openai>=3,<4",
    "pillow>=10,<13",
    "pydantic>=2.8,<3",
    "pypdf>=5,<7",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.0,<2",
    "reportlab>=4.4,<5",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["career_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
